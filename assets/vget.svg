<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fond squircle moderne avec ombre portée -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Glyphe central V lumineux (Play + Download) -->
  <g filter="url(#glow)">
    <!-- Branche gauche du V -->
    <path d="M140 160 L230 330 Q256 376 282 330 L372 160" fill="none" stroke="url(#vGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Flèche descendante centrale -->
    <path d="M256 160 L256 280 M216 240 L256 280 L296 240" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
